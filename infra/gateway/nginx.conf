worker_processes auto;

pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;
  types_hash_max_size 4096;

  client_max_body_size 1g;
  proxy_http_version 1.1;
  proxy_read_timeout 600s;
  proxy_send_timeout 600s;
  proxy_connect_timeout 5s;
  resolver 127.0.0.11 ipv6=off valid=10s;
  resolver_timeout 5s;

  client_body_temp_path /tmp/nginx/client-body;
  proxy_temp_path /tmp/nginx/proxy;
  fastcgi_temp_path /tmp/nginx/fastcgi;
  uwsgi_temp_path /tmp/nginx/uwsgi;
  scgi_temp_path /tmp/nginx/scgi;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  map $http_x_request_id $proxy_request_id {
    default $http_x_request_id;
    "" $request_id;
  }

  map "$realip_remote_addr|$remote_addr" $trusted_forwarded_proto_candidate {
    default $http_x_forwarded_proto;
    "~^(.+)\\|\\1$" "";
  }

  map $trusted_forwarded_proto_candidate $proxy_forwarded_proto {
    default $trusted_forwarded_proto_candidate;
    "" $scheme;
  }

  map $host $proxy_forwarded_host {
    default $host;
    "" $http_host;
  }

  map $proxy_forwarded_proto $proxy_forwarded_port_fallback {
    default 80;
    https 443;
  }

  map $proxy_forwarded_port_fallback $proxy_forwarded_port {
    default $proxy_forwarded_port_fallback;
    "" 80;
  }

  map $uri $gateway_route_class {
    default canonical;
    ~^/api/services(?:/|$) legacy;
    ~^/services(?:/|$) legacy;
    /api/v1 legacy;
    ~^/api/v1/(?:jv|xl|hood)(?:/|$) legacy;
    ~^/api/v1/uploads(?:/|$) legacy;
    ~^/api/v1/intakes/ws$ legacy;
    ~^/api/v1/(?!backend(?:/|$)|services(?:/|$)|orchestrator(?:/|$)|docs(?:/|$)).* legacy;
  }

  map $gateway_route_class $gateway_deprecation {
    default "";
    legacy true;
  }

  upstream frontend_upstream {
    zone frontend_upstream 64k;
    server frontend:8931 resolve;
  }

  upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8932 resolve;
  }

  upstream services_upstream {
    zone services_upstream 64k;
    server services:8000 resolve;
  }

  upstream orchestrator_upstream {
    zone orchestrator_upstream 64k;
    server orchestrator:8011 resolve;
  }

  log_format gateway_json escape=json
    '{'
      '"time":"$time_iso8601",'
      '"request_id":"$proxy_request_id",'
      '"route_class":"$gateway_route_class",'
      '"method":"$request_method",'
      '"uri":"$uri",'
      '"status":$status,'
      '"bytes_sent":$bytes_sent,'
      '"request_time":$request_time,'
      '"upstream_status":"$upstream_status",'
      '"upstream_response_time":"$upstream_response_time",'
      '"host":"$host",'
      '"remote_addr":"$remote_addr",'
      '"forwarded_for":"$remote_addr"'
    '}';

  access_log /dev/stdout gateway_json;
  error_log /dev/stderr notice;

  include /etc/nginx/conf.d/*.conf;
}

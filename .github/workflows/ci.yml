name: CI

on:
  pull_request:
    branches:
      - stage
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repo-safety:
    name: repo-safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail on real .env files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t env_files < <(find . \
            -path './.git' -prune -o \
            -type f \( -name '.env' -o -name '.env.*' \) \
            ! -name '.env.example' \
            ! -name '.env.*.example' \
            -print | sort)

          if ((${#env_files[@]} > 0)); then
            echo "Real .env files are forbidden:"
            printf '%s\n' "${env_files[@]}"
            exit 1
          fi

      - name: Fail on forbidden artifact directories
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t forbidden_dirs < <(find . \
            -path './.git' -prune -o \
            -type d \( \
              -name 'node_modules' -o \
              -name 'target' -o \
              -name '.next' -o \
              -name 'build' -o \
              -name 'dist' -o \
              -name 'venv' -o \
              -name 'env' -o \
              -name '__pycache__' -o \
              -name '.pytest_cache' -o \
              -name '.ruff_cache' -o \
              -name '.mypy_cache' -o \
              -name '.dart_tool' -o \
              -name 'coverage' \
            \) -print | sort)

          if ((${#forbidden_dirs[@]} > 0)); then
            echo "Forbidden artifact directories found:"
            printf '%s\n' "${forbidden_dirs[@]}"
            exit 1
          fi

      - name: Fail on nested .github or .gitea directories
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t nested_meta_dirs < <(find . \
            -path './.git' -prune -o \
            -type d \( -name '.github' -o -name '.gitea' \) \
            ! -path './.github' \
            -print | sort)

          if ((${#nested_meta_dirs[@]} > 0)); then
            echo "Nested .github/.gitea directories are forbidden:"
            printf '%s\n' "${nested_meta_dirs[@]}"
            exit 1
          fi

      - name: Fail on risky key and certificate filenames
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t risky_files < <(find . \
            -path './.git' -prune -o \
            -type f \( \
              -name '*.pem' -o \
              -name '*.key' -o \
              -name '*.p12' -o \
              -name '*.jks' -o \
              -name '*.keystore' -o \
              -name 'id_rsa' -o \
              -name 'id_ed25519' \
            \) -print | sort)

          if ((${#risky_files[@]} > 0)); then
            echo "Risky key/certificate files found:"
            printf '%s\n' "${risky_files[@]}"
            exit 1
          fi

  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker Compose version
        run: docker compose version

      - name: Validate local dependency compose config
        run: docker compose -f infra/local/docker-compose.dev.yml config

      - name: Validate database-service compose config
        run: docker compose -f services/database-service/docker-compose.yml config

  database-service:
    name: database-service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: services/database-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Show uv version
        run: uv --version

      - name: Create virtual environment
        run: uv venv --python 3.13

      - name: Install database-service dependencies
        run: uv pip install -r requirements.txt

      - name: List installed dependencies
        run: uv pip list

      - name: Compile Django settings
        run: uv run python -m py_compile database_service/settings.py

      - name: Compile orders parser service
        run: uv run python -m py_compile orders_pars/service.py

      - name: Validate critical imports
        run: uv run python -c "import django; import rest_framework; import requests; import dotenv; import corsheaders; import PIL; import mysql.connector"

  rust-backend-metadata:
    name: rust-backend-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Read cargo metadata
        run: cargo metadata --no-deps

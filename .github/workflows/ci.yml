name: CI

on:
  pull_request:
    branches:
      - stage
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      database_service: ${{ steps.detect.outputs.database_service }}
      frontend: ${{ steps.detect.outputs.frontend }}
      mobile: ${{ steps.detect.outputs.mobile }}
      orchestrator: ${{ steps.detect.outputs.orchestrator }}
      rust_backend: ${{ steps.detect.outputs.rust_backend }}
      python_services_docker_build: ${{ steps.detect.outputs.python_services_docker_build }}
      frontend_docker_build: ${{ steps.detect.outputs.frontend_docker_build }}
      gateway_routing_contract: ${{ steps.detect.outputs.gateway_routing_contract }}
      remaining_docker_builds: ${{ steps.detect.outputs.remaining_docker_builds }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          outputs=(
            database_service
            frontend
            mobile
            orchestrator
            rust_backend
            python_services_docker_build
            frontend_docker_build
            gateway_routing_contract
            remaining_docker_builds
          )

          set_out() {
            printf '%s=%s\n' "$1" "$2" >> "$GITHUB_OUTPUT"
          }

          set_all() {
            local value="$1"
            for output in "${outputs[@]}"; do
              set_out "$output" "$value"
            done
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "workflow_dispatch detected; running full CI."
            set_all true
            exit 0
          fi

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          git diff --name-only "$base_sha" "$head_sha" | sort > changed-files.txt

          echo "Changed files:"
          cat changed-files.txt

          if grep -Eq '^\.github/workflows/ci\.yml$' changed-files.txt; then
            echo "CI workflow changed; running full CI."
            set_all true
            exit 0
          fi

          changed() {
            grep -Eq "$1" changed-files.txt
          }

          set_changed() {
            local output="$1"
            local pattern="$2"

            if changed "$pattern"; then
              set_out "$output" true
            else
              set_out "$output" false
            fi
          }

          set_changed database_service '^services/database-service/'
          set_changed frontend '^apps/frontend/'
          set_changed mobile '^apps/mobile/'
          set_changed orchestrator '^services/orchestrator/'
          set_changed rust_backend '^apps/backend/'
          set_changed python_services_docker_build '^services/'
          set_changed frontend_docker_build '^apps/frontend/'
          set_changed gateway_routing_contract '^infra/gateway/'
          set_changed remaining_docker_builds '^(apps/backend/|apps/mobile/|infra/)'

  repo-safety:
    name: repo-safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fail on real .env files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t env_files < <(find . \
            -path './.git' -prune -o \
            -type f \( -name '.env' -o -name '.env.*' \) \
            ! -name '.env.example' \
            ! -name '.env.*.example' \
            -print | sort)

          if ((${#env_files[@]} > 0)); then
            echo "Real .env files are forbidden:"
            printf '%s\n' "${env_files[@]}"
            exit 1
          fi

      - name: Fail on forbidden artifact directories
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t forbidden_dirs < <(find . \
            -path './.git' -prune -o \
            -type d \( \
              -name 'node_modules' -o \
              -name 'target' -o \
              -name '.next' -o \
              -name 'build' -o \
              -name 'dist' -o \
              -name 'venv' -o \
              -name 'env' -o \
              -name '__pycache__' -o \
              -name '.pytest_cache' -o \
              -name '.ruff_cache' -o \
              -name '.mypy_cache' -o \
              -name '.dart_tool' -o \
              -name 'coverage' \
            \) -print | sort)

          if ((${#forbidden_dirs[@]} > 0)); then
            echo "Forbidden artifact directories found:"
            printf '%s\n' "${forbidden_dirs[@]}"
            exit 1
          fi

      - name: Fail on nested .github or .gitea directories
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t nested_meta_dirs < <(find . \
            -path './.git' -prune -o \
            -type d \( -name '.github' -o -name '.gitea' \) \
            ! -path './.github' \
            -print | sort)

          if ((${#nested_meta_dirs[@]} > 0)); then
            echo "Nested .github/.gitea directories are forbidden:"
            printf '%s\n' "${nested_meta_dirs[@]}"
            exit 1
          fi

      - name: Fail on risky key and certificate filenames
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t risky_files < <(find . \
            -path './.git' -prune -o \
            -type f \( \
              -name '*.pem' -o \
              -name '*.key' -o \
              -name '*.p12' -o \
              -name '*.jks' -o \
              -name '*.keystore' -o \
              -name 'id_rsa' -o \
              -name 'id_ed25519' \
            \) -print | sort)

          if ((${#risky_files[@]} > 0)); then
            echo "Risky key/certificate files found:"
            printf '%s\n' "${risky_files[@]}"
            exit 1
          fi

  compose-config:
    name: compose-config
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker Compose version
        run: docker compose version

      - name: Test required env validator
        shell: pwsh
        run: ./infra/scripts/tests/verify-required-env.tests.ps1

      - name: Test compose env mapping validator
        shell: pwsh
        run: ./infra/scripts/tests/verify-compose-service-env-mappings.tests.ps1

      - name: Validate stage deploy env template
        shell: pwsh
        run: ./infra/scripts/verify-required-env.ps1 -EnvFile infra/deploy/stage/env.stage.sanitized.template -Environment stage -InputKind Template

      - name: Validate prod deploy env template
        shell: pwsh
        run: ./infra/scripts/verify-required-env.ps1 -EnvFile infra/deploy/prod/env.prod.sanitized.template -Environment prod -InputKind Template

      - name: Validate stage compose runtime env mappings
        shell: pwsh
        run: ./infra/scripts/verify-compose-service-env-mappings.ps1 -ComposePath infra/deploy/stage/docker-compose.yml -Environment stage

      - name: Validate prod compose runtime env mappings
        shell: pwsh
        run: ./infra/scripts/verify-compose-service-env-mappings.ps1 -ComposePath infra/deploy/prod/docker-compose.yml -Environment prod

      - name: Reject legacy deploy host-port variables
        shell: bash
        run: |
          pattern='STAGE_(FRONTEND|BACKEND|POSTGRES|SERVICES|ORCHESTRATOR)_PORT|PROD_(FRONTEND|BACKEND|POSTGRES|SERVICES|ORCHESTRATOR)_PORT'
          paths=(
            .env.example
            infra/.env.example
            infra/deploy/stage
            infra/deploy/prod
            infra/OPS_HEALTH_VERIFICATION.md
            infra/docs/STAGE_SMOKE_SIGNOFF_TEMPLATE.md
            docs/runbooks/env-contract.md
          )

          if git grep -nE "$pattern" -- "${paths[@]}"; then
            echo "Legacy deploy host-port variables remain in active files." >&2
            exit 1
          fi

      - name: Validate local dependency compose config
        run: docker compose -f infra/local/docker-compose.dev.yml config

      - name: Validate database-service compose config
        run: docker compose -f services/database-service/docker-compose.yml config

      - name: Validate stage compose config
        run: docker compose --env-file infra/deploy/stage/env.stage.sanitized.template -f infra/deploy/stage/docker-compose.yml config --quiet

      - name: Validate prod compose config
        run: docker compose --env-file infra/deploy/prod/env.prod.sanitized.template -f infra/deploy/prod/docker-compose.yml config --quiet

      - name: Enforce gateway-only stage port publishing
        run: >
          python3 infra/scripts/verify-gateway-only-ports.py
          --compose infra/deploy/stage/docker-compose.yml
          --env-file infra/deploy/stage/env.stage.sanitized.template
          --expected-gateway-port 8940

      - name: Enforce gateway-only prod port publishing
        run: >
          python3 infra/scripts/verify-gateway-only-ports.py
          --compose infra/deploy/prod/docker-compose.yml
          --env-file infra/deploy/prod/env.prod.sanitized.template
          --expected-gateway-port 8950

      - name: Validate gateway contract test compose config
        run: docker compose -f infra/gateway/tests/docker-compose.gateway.yml config

      - name: Bash syntax check legacy stage runtime reconciliation helper
        run: bash -n infra/scripts/run-stage-runtime-reconciliation.sh

      - name: Parse disabled legacy stage runtime reconciliation workflow YAML
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/stage-runtime-reconcile.yml")'

  database-service:
    name: database-service
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.database_service == 'true'
    defaults:
      run:
        working-directory: services/database-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py313-database-service-${{ hashFiles('services/database-service/requirements.txt') }}
          restore-keys: |
            uv-${{ runner.os }}-py313-database-service-
            uv-${{ runner.os }}-py313-
            uv-${{ runner.os }}-

      - name: Show uv version
        run: uv --version

      - name: Create virtual environment
        run: uv venv --python 3.13

      - name: Install database-service dependencies
        run: uv pip install --python .venv/bin/python -r requirements.txt

      - name: List installed dependencies
        run: uv pip list --python .venv/bin/python

      - name: Compile Django settings
        run: .venv/bin/python -m py_compile database_service/settings.py

      - name: Compile orders parser service
        run: .venv/bin/python -m py_compile orders_pars/service.py

      - name: Validate critical imports
        run: .venv/bin/python -c "import django; import rest_framework; import requests; import dotenv; import corsheaders; import PIL; import mysql.connector"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend lint
        run: npm run lint --if-present

      - name: Run frontend typecheck
        run: npm run typecheck --if-present

      - name: Run frontend tests
        run: npm test --if-present

  mobile:
    name: mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.4"
          channel: stable
          cache: true

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            apps/mobile/.gradle
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/**/gradle-wrapper.properties', 'apps/mobile/**/*.gradle*', 'apps/mobile/**/settings.gradle*', 'apps/mobile/pubspec.lock') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Show Flutter version
        run: flutter --version

      - name: Show Dart version
        run: dart --version

      - name: Install mobile dependencies
        run: flutter pub get

      - name: Check owned mobile formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Run mobile analyze
        run: flutter analyze

      - name: Run mobile tests
        run: flutter test

  orchestrator:
    name: orchestrator
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.orchestrator == 'true'
    defaults:
      run:
        working-directory: services/orchestrator
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Cache uv downloads
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py313-orchestrator-${{ hashFiles('services/orchestrator/requirements.txt') }}
          restore-keys: |
            uv-${{ runner.os }}-py313-orchestrator-
            uv-${{ runner.os }}-py313-
            uv-${{ runner.os }}-

      - name: Show uv version
        run: uv --version

      - name: Create virtual environment
        run: uv venv --python 3.13

      - name: Install orchestrator dependencies
        run: uv pip install --python .venv/bin/python -r requirements.txt

      - name: List installed dependencies
        run: uv pip list --python .venv/bin/python

      - name: Compile orchestrator main
        run: .venv/bin/python -m py_compile src/sofort_orchestrator/main.py

      - name: Compile orchestrator service
        run: .venv/bin/python -m py_compile src/sofort_orchestrator/application/orchestrator_service.py

      - name: Compile orchestrator job store
        run: .venv/bin/python -m py_compile src/sofort_orchestrator/infra/job_store.py

      - name: Compile orchestrator HTTP client
        run: .venv/bin/python -m py_compile src/sofort_orchestrator/infra/http_client.py

      - name: Run orchestrator tests
        run: .venv/bin/python -m pytest -q

  rust-backend:
    name: rust-backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.rust_backend == 'true'
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust cargo and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/backend/target
          key: rust-${{ runner.os }}-${{ hashFiles('apps/backend/Cargo.lock', 'apps/backend/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Run rustfmt check
        run: cargo fmt --all -- --check

      - name: Run cargo check
        run: cargo check

      - name: Run clippy
        run: cargo clippy -- -D warnings

      - name: Run backend tests
        run: cargo test

  python-services-docker-build:
    name: python-services-docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.python_services_docker_build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker version
        run: docker --version

      - name: Show Docker Compose version
        run: docker compose version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build database-service image
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/database-service/Dockerfile
          load: true
          tags: warehub-database-service:ci-validation
          cache-from: type=gha,scope=ci-database-service
          cache-to: type=gha,mode=max,scope=ci-database-service

      - name: Build orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: services/orchestrator
          file: services/orchestrator/Dockerfile
          load: true
          tags: warehub-orchestrator:ci-validation
          cache-from: type=gha,scope=ci-orchestrator
          cache-to: type=gha,mode=max,scope=ci-orchestrator

      - name: List validation images
        run: docker image ls --filter "reference=warehub-*:*"

  frontend-docker-build:
    name: frontend-docker-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.frontend_docker_build == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker version
        run: docker --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          target: prod
          load: true
          tags: warehub-frontend:ci-validation
          cache-from: type=gha,scope=ci-frontend
          cache-to: type=gha,mode=max,scope=ci-frontend

      - name: List validation image
        run: docker image ls --filter "reference=warehub-frontend:*"

  gateway-routing-contract:
    name: gateway-routing-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: changes
    if: needs.changes.outputs.gateway_routing_contract == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Show Docker version
        run: docker --version

      - name: Show Docker Compose version
        run: docker compose version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build gateway image
        uses: docker/build-push-action@v6
        with:
          context: infra/gateway
          file: infra/gateway/Dockerfile
          load: true
          tags: warehub-gateway:ci-validation
          cache-from: type=gha,scope=ci-gateway
          cache-to: type=gha,mode=max,scope=ci-gateway

      - name: Validate gateway nginx config
        run: >
          docker run --rm
          --add-host frontend:127.0.0.1
          --add-host backend:127.0.0.1
          --add-host services:127.0.0.1
          --add-host orchestrator:127.0.0.1
          --add-host host.docker.internal:host-gateway
          warehub-gateway:ci-validation nginx -t

      - name: Run gateway routing contract tests
        run: node --test infra/gateway/tests/gateway-contract.test.mjs

  remaining-docker-builds:
    name: remaining-docker-builds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: changes
    if: needs.changes.outputs.remaining_docker_builds == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Docker version
        run: docker --version

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          target: prod
          load: true
          tags: warehub-backend:ci-validation
          cache-from: type=gha,scope=ci-backend
          cache-to: type=gha,mode=max,scope=ci-backend

      - name: Build mobile image
        uses: docker/build-push-action@v6
        with:
          context: apps/mobile
          file: apps/mobile/Dockerfile
          target: prod
          load: true
          tags: warehub-mobile:ci-validation
          cache-from: type=gha,scope=ci-mobile
          cache-to: type=gha,mode=max,scope=ci-mobile

      - name: Build infra image
        uses: docker/build-push-action@v6
        with:
          context: infra
          file: infra/Dockerfile
          target: prod
          load: true
          tags: warehub-infra:ci-validation
          cache-from: type=gha,scope=ci-infra
          cache-to: type=gha,mode=max,scope=ci-infra

      - name: List validation images
        run: docker image ls --filter "reference=warehub-*:*"

name: GHCR Publish

on:
  workflow_dispatch:
    inputs:
      tag_prefix:
        description: "Image tag prefix"
        required: true
        default: "stage"
      push_stage_latest:
        description: "Also push stage-latest convenience tag"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-images:
    name: publish-images
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        shell: bash
        run: |
          set -euo pipefail

          owner_lower="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          repo_name="$(printf '%s' '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          short_sha="$(printf '%s' '${{ github.sha }}' | cut -c1-7)"
          tag_prefix="$(printf '%s' '${{ inputs.tag_prefix }}' | tr '[:upper:]' '[:lower:]')"

          if [[ ! "$tag_prefix" =~ ^[a-z0-9][a-z0-9._-]*$ ]]; then
            echo "Invalid tag_prefix: $tag_prefix"
            exit 1
          fi

          image_tag="${tag_prefix}-${short_sha}"
          optional_latest_tag=""
          if [[ '${{ inputs.push_stage_latest }}' == 'true' ]]; then
            optional_latest_tag="${tag_prefix}-latest"
          fi

          {
            echo "IMAGE_OWNER=$owner_lower"
            echo "IMAGE_REPO=$repo_name"
            echo "SHORT_SHA=$short_sha"
            echo "IMAGE_TAG=$image_tag"
            echo "OPTIONAL_LATEST_TAG=$optional_latest_tag"
            echo "BACKEND_IMAGE=ghcr.io/$owner_lower/$repo_name/backend"
            echo "FRONTEND_IMAGE=ghcr.io/$owner_lower/$repo_name/frontend"
            echo "MOBILE_IMAGE=ghcr.io/$owner_lower/$repo_name/mobile"
            echo "SERVICES_IMAGE=ghcr.io/$owner_lower/$repo_name/services"
            echo "ORCHESTRATOR_IMAGE=ghcr.io/$owner_lower/$repo_name/orchestrator"
            echo "INFRA_IMAGE=ghcr.io/$owner_lower/$repo_name/infra"
          } >> "$GITHUB_ENV"

      - name: Print planned immutable tag
        shell: bash
        run: |
          set -euo pipefail
          echo "Planned immutable tag: $IMAGE_TAG"
          if [[ -n "${OPTIONAL_LATEST_TAG:-}" ]]; then
            echo "Planned convenience tag: $OPTIONAL_LATEST_TAG"
          fi

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.OPTIONAL_LATEST_TAG != '' && format('{0}:{1}', env.BACKEND_IMAGE, env.OPTIONAL_LATEST_TAG) || '' }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: apps/frontend
          file: apps/frontend/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.OPTIONAL_LATEST_TAG != '' && format('{0}:{1}', env.FRONTEND_IMAGE, env.OPTIONAL_LATEST_TAG) || '' }}

      - name: Build and push mobile image
        uses: docker/build-push-action@v6
        with:
          context: apps/mobile
          file: apps/mobile/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.MOBILE_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.OPTIONAL_LATEST_TAG != '' && format('{0}:{1}', env.MOBILE_IMAGE, env.OPTIONAL_LATEST_TAG) || '' }}

      - name: Build and push services image
        uses: docker/build-push-action@v6
        with:
          context: services
          file: services/database-service/Dockerfile
          push: true
          tags: |
            ${{ env.SERVICES_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.OPTIONAL_LATEST_TAG != '' && format('{0}:{1}', env.SERVICES_IMAGE, env.OPTIONAL_LATEST_TAG) || '' }}

      - name: Build and push orchestrator image
        uses: docker/build-push-action@v6
        with:
          context: services/orchestrator
          file: services/orchestrator/Dockerfile
          push: true
          tags: |
            ${{ env.ORCHESTRATOR_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.OPTIONAL_LATEST_TAG != '' && format('{0}:{1}', env.ORCHESTRATOR_IMAGE, env.OPTIONAL_LATEST_TAG) || '' }}

      - name: Build and push infra image
        uses: docker/build-push-action@v6
        with:
          context: infra
          file: infra/Dockerfile
          target: prod
          push: true
          tags: |
            ${{ env.INFRA_IMAGE }}:${{ env.IMAGE_TAG }}
            ${{ env.OPTIONAL_LATEST_TAG != '' && format('{0}:{1}', env.INFRA_IMAGE, env.OPTIONAL_LATEST_TAG) || '' }}

      - name: Write publish summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## GHCR Publish"
            echo
            echo "- Immutable tag: \`$IMAGE_TAG\`"
            if [[ -n "${OPTIONAL_LATEST_TAG:-}" ]]; then
              echo "- Convenience tag: \`$OPTIONAL_LATEST_TAG\`"
            else
              echo "- Convenience tag: not pushed"
            fi
            echo
            echo "### Pushed image refs"
            echo "- \`$BACKEND_IMAGE:$IMAGE_TAG\`"
            echo "- \`$FRONTEND_IMAGE:$IMAGE_TAG\`"
            echo "- \`$MOBILE_IMAGE:$IMAGE_TAG\`"
            echo "- \`$SERVICES_IMAGE:$IMAGE_TAG\`"
            echo "- \`$ORCHESTRATOR_IMAGE:$IMAGE_TAG\`"
            echo "- \`$INFRA_IMAGE:$IMAGE_TAG\`"
            if [[ -n "${OPTIONAL_LATEST_TAG:-}" ]]; then
              echo
              echo "### Convenience tags"
              echo "- \`$BACKEND_IMAGE:$OPTIONAL_LATEST_TAG\`"
              echo "- \`$FRONTEND_IMAGE:$OPTIONAL_LATEST_TAG\`"
              echo "- \`$MOBILE_IMAGE:$OPTIONAL_LATEST_TAG\`"
              echo "- \`$SERVICES_IMAGE:$OPTIONAL_LATEST_TAG\`"
              echo "- \`$ORCHESTRATOR_IMAGE:$OPTIONAL_LATEST_TAG\`"
              echo "- \`$INFRA_IMAGE:$OPTIONAL_LATEST_TAG\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

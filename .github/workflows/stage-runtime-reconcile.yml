name: Legacy Stage Runtime Reconciliation Disabled

on:
  workflow_dispatch:
    inputs:
      confirm_disabled_workflow:
        description: "This workflow is disabled. Use Stage Deploy instead."
        required: true

permissions:
  contents: read

concurrency:
  group: legacy-stage-runtime-reconciliation-disabled
  cancel-in-progress: false

jobs:
  disabled:
    name: disabled
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain replacement workflow
        shell: bash
        run: |
          set -euo pipefail

          echo "This legacy workflow is intentionally disabled."
          echo
          echo "Use the Stage Deploy workflow instead:"
          echo "  gh workflow run stage-deploy.yml --ref stage -f confirm_stage_deploy=DEPLOY_STAGE_RUNTIME"
          echo
          echo "Reason:"
          echo "- the old reconciliation workflow used hardcoded expected image refs and live SHA values"
          echo "- stage is now deployed by Stage Deploy using /opt/warehub/stage/.deploy-state.env"
          exit 1

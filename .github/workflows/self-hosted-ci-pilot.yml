name: Self-hosted CI pilot

on:
  workflow_dispatch:
    inputs:
      suite:
        description: Check to run inside the isolated CI VM
        type: choice
        options:
          - smoke
          - orchestrator
        default: smoke
        required: true

permissions:
  contents: read

concurrency:
  group: warehub-self-hosted-pilot
  cancel-in-progress: false

jobs:
  smoke:
    if: github.ref == 'refs/heads/stage' || github.ref == 'refs/heads/main'
    runs-on: [warehub-ci-pilot]
    timeout-minutes: 20
    steps:
      - name: Check isolated VM tools
        shell: bash
        run: |
          set -euo pipefail
          test "$(hostname)" = warehub-ci-pilot
          test "$(id -un)" = runner
          test "$(nproc)" -eq 2
          test ! -e /opt/warehub/prod/.env
          test ! -e /opt/warehub/stage/.env
          git --version
          node --version
          python3 --version
          docker info --format '{{.Name}}'
          docker run --rm --cpus=1 --memory=128m hello-world

      - name: Checkout trusted branch
        if: inputs.suite == 'orchestrator'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        if: inputs.suite == 'orchestrator'
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        if: inputs.suite == 'orchestrator'
        uses: astral-sh/setup-uv@v5

      - name: Run orchestrator checks
        if: inputs.suite == 'orchestrator'
        working-directory: services/orchestrator
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.13
          uv pip install --python .venv/bin/python -r requirements.txt
          .venv/bin/python -m py_compile \
            src/sofort_orchestrator/main.py \
            src/sofort_orchestrator/application/orchestrator_service.py \
            src/sofort_orchestrator/infra/job_store.py \
            src/sofort_orchestrator/infra/http_client.py
          .venv/bin/python -m pytest -q
